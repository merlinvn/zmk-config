# Report battery level every 300 seconds, including the split peripheral level.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Set sleep timeout to 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable the Bluetooth Battery Service; ZMK still reports battery over HID.
CONFIG_BT_BAS=y

# Enable Bluetooth for the split halves and Bluetooth keymap controls
CONFIG_ZMK_BLE=y

# Also allow the left (central) half to send keyboard input over USB.
CONFIG_ZMK_USB=y

# Bluetooth tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
