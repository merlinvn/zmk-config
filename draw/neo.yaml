layout:
  qmk_keyboard: corne_rotated
  layout_name: LAYOUT_split_3x5_3
layers:
  DEF:
    - [Q, W, F, P, B, Z, L, U, Y, Enter]
    - [{h: Gui, t: A}, {h: Alt, t: R}, {h: Ctrl, t: S}, {h: Shift, t: T}, G, M, {h: Shift, t: N}, {h: Ctrl, t: H}, {h: Alt, t: I}, {h: Gui, t: O}]
    - ["'", X, C, {h: NUM, t: D}, V, /, J, K, ",", .]
    - null
    - Meh
    - {h: NAV,   t: Space}
    - {h: SYM,   t: E}
    - FUN
    - null
  SYM:
    - ["!", "@", "{", "}", "%", "'", "^", "&", "$", Enter]
    - [{h: Gui, t: ";"}, {h: Alt, t: ":"}, {h: Ctrl, t: "("}, {h: Shift, t: ")"}, "=", "|", {h: Shift, t: "<"}, {h: Ctrl, t: ">"}, {h: Alt, t: "-"}, {h: Gui, t: "_"}]
    - ["\"" , "+", "[", "]", "\\", "?" , "#", "*", "`", "~"]
    - null
    - {type: ghost}
    - {h: MED, t: Space}
    - {type: held}
    - {type: ghost}
    - null
  NAV:
    - ["Gui Tab", "Alt Tab", "C-S Tab", "Ctrl Tab", "Meh-P", Insert, Home,  Up, End, Enter]
    - [Gui, Alt, Ctrl, Shift, "Meh-X", Bspace, Left, Down, Right, Caps Word]
    - [Gui Space, Alt Space, Ctrl Space, Shift NUM, Meh-Space, K_APP, Page Down, Page Up, Del, Caps]
    - null
    - Meh-Space
    - {type: held}
    - MED
    - {type: ghost}
    - null
  NUM:
    - [null, null, null, null, null, /, 7, 8, 9, Enter]
    - [Gui, Alt, Ctrl, Shift, null, '*', 4, 5, 6, +]
    - [null, null, null, {type: held}, null,'-', 1, 2, 3, .]
    - null
    - Meh
    - {h: Shift, t: Space}
    - 0
    - '='
    - null
  FUN:
    - [F10, F7, F8, F9, F5, Print Scrn, Play Pause, Prev, Next, Stop]
    - [F11, F4, F5, F6, Screen Lock, Bright +, Shift, Ctrl, Alt, Gui]
    - [F12, F1, F2, F3, Pause Break, Bright -, Mute, Vol -, Vol +, null]
    - null
    - {type: ghost}
    - Space
    - {type: ghost}
    - {type: held} 
    - null
  MED:
    - [null, null, null, null, null, null, null, null, Reset, Bootloader]
    - [BT0, BT1, BT2, BT3, BT4, Bright +, Shift, Ctrl, Alt, Gui]
    - [Output Toggle, Output BT, Output USB, null, BT Clear, null, null, null, null, null]
    - null
    - {type: ghost}
    - {type: held}  
    - {type: held} 
    - {type: ghost}
    - null
combos:
  - {p: [1, 2], k: "qu", l: ["DEF"]}
  - {p: [2, 3], k: "+", l: ["DEF"]}
  - {p: [3, 4], k: "Reset", l: ["DEF", "SYM", "NAV"]}
  - {p: [6, 7],   k: "#", l: ["DEF"]}
  - {p: [7, 8],   k: "*", l: ["DEF"]}
  - {p: [11, 12], k: "Tab A-C", l: ["DEF", "SYM", "NAV"]}
  - {p: [12, 13], k: "Esc C-S", l: ["DEF", "SYM", "NAV"]}
  - {p: [16, 17], k: ": C-S", l: ["DEF"]}
  - {p: [17, 18], k: "Bspace A-C", l: ["DEF", "SYM", "NAV"]}
  - {p: [21, 22], k: "[", l: ["DEF"]}
  - {p: [22, 23], k: "-", l: ["DEF"]}
  # - {p: [21, 23], k: "<", l: ["DEF"]}
  - {p: [26, 27], k: "_", l: ["DEF"]}
  - {p: [27, 28], k: "]", l: ["DEF"]}
  # - {p: [26, 28], k: ">", l: ["DEF"]}
